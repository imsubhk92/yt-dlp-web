[project]
name = "yt-dlp-web"
version = "0.1.0"
description = "A local video and playlist downloader with FastAPI and React"
requires-python = ">=3.13,<3.14"
dependencies = [
  "aiosqlite>=0.21",
  "fastapi>=0.115",
  "pydantic-settings>=2.7",
  "uvicorn[standard]>=0.34",
  "yt-dlp[default]>=2026.1.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "httpx2>=2.16.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: real local yt-dlp and FFmpeg pipeline"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".cache", ".tools", "frontend/node_modules", "frontend/dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ASYNC240"]

[tool.uv]
package = false
